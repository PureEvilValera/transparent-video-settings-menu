# A tag makes a release: the script alone, checked and with its SHA-256 in the notes.
# Nothing is compiled; the asset is the file a player downloads.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (default: the pushed tag)"
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check the script and the pack it carries
        run: |
          set -eu
          sh -n horizon-for-shader-debug
          test -x horizon-for-shader-debug
          # The embedded zip decodes, and holds the manifest and the five blank textures.
          sed -n '/^pack_zip()/,/^}/p' horizon-for-shader-debug > /tmp/pack.sh
          sh -c '. /tmp/pack.sh; pack_zip /tmp/pack.zip'
          python3 - /tmp/pack.zip <<'PY'
          import sys, zipfile
          names = set(zipfile.ZipFile(sys.argv[1]).namelist())
          want = {"pack.mcmeta"} | {
              f"assets/minecraft/textures/gui/{n}.png"
              for n in (
                  "inworld_menu_background",
                  "menu_background",
                  "inworld_menu_list_background",
                  "menu_list_background",
                  "options_background",
              )
          }
          assert names == want, (sorted(names), sorted(want))
          print("pack ok:", len(names), "files")
          PY
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          sha=$(sha256sum horizon-for-shader-debug | cut -d' ' -f1)
          cat > notes.md <<EOF
          Starts Horizon with the settings and shader-pack screens undimmed, for tuning shader packs.

          **Install**

          \`\`\`sh
          mkdir -p ~/.local/bin
          curl -LO https://github.com/${{ github.repository }}/releases/download/$TAG/horizon-for-shader-debug
          mv horizon-for-shader-debug ~/.local/bin/
          chmod +x ~/.local/bin/horizon-for-shader-debug
          \`\`\`

          \`~/.local/bin\` is on \`PATH\` in most setups; in fish, \`set -gx PATH \$HOME/.local/bin \$PATH\` adds it.

          **Use**

          \`\`\`sh
          horizon-for-shader-debug               # the newest installed version
          horizon-for-shader-debug 9f42064       # any installed version, by a part of its name
          \`\`\`

          It adds one resource pack of transparent menu textures to the instance (kept on) and
          starts the game with \`HORIZON_MENU_STYLE=vanilla\`. The no-dimming look needs the 18
          November build (\`0b14f8a\`) or newer; on older builds the tiled background goes and the
          veil stays, and the script says so.

          SHA-256: \`$sha\`
          EOF
          gh release create "$TAG" horizon-for-shader-debug \
            --title "$TAG" --notes-file notes.md --verify-tag \
            || gh release upload "$TAG" horizon-for-shader-debug --clobber
