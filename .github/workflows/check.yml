# Whether the bundle still applies on the Horizon it pins: horizon-mixins plan over
# GitHub's archive of that commit. No game is compiled here; the registry checks that.
name: check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Rust the Horizon launcher builds native mods with (launcher/src/rust_toolchain.rs).
  RUST_VERSION: "1.99.1"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      # horizon-mixins resolves Horizon's workspace with cargo, so its crates must be in the cache.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .ci/horizon
      - name: Plan the bundle on the pinned Horizon
        run: python3 tools/ci.py check
      - name: Package and check what the bundle holds
        run: |
          python3 tools/ci.py package
          python3 - <<'PY'
          import glob, json, zipfile
          path, = glob.glob("dist/*.hnmod")
          archive = zipfile.ZipFile(path)
          names = archive.namelist()
          manifest = json.loads(archive.read("horizon-native.json"))
          assert manifest["schema"] == 1, manifest
          assert manifest["hooks"] >= 1, manifest
          bundle = f"mixins/{manifest['id']}/"
          assert "horizon-mixin.toml" in names and f"{bundle}LICENSE" in names, names
          assert all(n.startswith(bundle) or n == "horizon-native.json" for n in names), names
          print(path, manifest)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hnmod
          path: dist/*.hnmod
